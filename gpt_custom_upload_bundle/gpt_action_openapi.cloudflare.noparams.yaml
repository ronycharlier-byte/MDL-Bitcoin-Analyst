openapi: "3.1.0"
info:
  title: "Quant BTC Model Worker Strict GPT Action Schema"
  version: "1.15.1-strict200"
  description: "Ultra-compatible GPT Actions schema. No parameters, no refs, no non-200 response schemas. BTC is implicit on all run endpoints. Outputs are probabilistic, not deterministic predictions."
servers:
  -
    url: "https://quant-btc-model-lite.mdl-bitcoin-analyst.workers.dev"
paths:
  /health:
    get:
      operationId: "health"
      summary: "Health check"
      description: "Check Worker availability."
      responses:
        200:
          description: "Successful JSON response from Quant BTC Model Worker."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                  service:
                    type: "string"
                  asset:
                    type: "string"
                  archive_id:
                    type: "string"
                  run_id:
                    type: "string"
                  report_date_utc:
                    type: "string"
                  timestamp_utc:
                    type: "string"
                  timestamp_paris:
                    type: "string"
                  source:
                    type: "string"
                  message:
                    type: "string"
                  warning:
                    type: "string"
                  report_markdown:
                    type: "string"
  /version:
    get:
      operationId: "getQuantBtcLiteVersion"
      summary: "Get Worker version"
      description: "Return Worker/schema/version metadata and preset information."
      responses:
        200:
          description: "Successful JSON response from Quant BTC Model Worker."
          content:
