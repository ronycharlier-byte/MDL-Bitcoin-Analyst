openapi: 3.1.0
info:
  title: Quant BTC Model API
  version: 1.0.0
  description: Probabilistic Bitcoin quantitative model endpoint for GPT Custom Actions.
servers:
  - url: https://quant-btc-model-api.onrender.com
    description: Render deployment.
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - mode
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: quant-btc-model
                  mode:
                    type: string
                    example: probabilistic
  /run:
    post:
      operationId: runQuantBtcModel
      summary: Run the probabilistic BTC model
      description: Produces probabilities, distributions, risk metrics, stress tests and provenance. Never returns deterministic advice.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - horizon
                - simulations
                - model
              properties:
                asset:
                  type: string
                  default: BTC
                  description: Asset symbol. BTC is the supported production target.
                horizon:
                  type: integer
                  default: 365
                  minimum: 1
                  maximum: 3650
                simulations:
                  type: integer
                  default: 200000
                  minimum: 100
                  maximum: 250000
                model:
                  type: string
                  default: ensemble
                  enum:
                    - ensemble
                    - monte_carlo
                    - student_t
                    - jump_diffusion
                    - garch
                    - regime_switching
                    - liquidation
                    - correlation
                skip_corpus:
                  type: boolean
                  default: true
                no_online:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Probabilistic model result with provenance.
          content:
            application/json:
              schema:
                type: object
                required:
                  - run_id
                  - warning
                properties:
                  run_id:
                    type: string
                  asset:
                    type: string
                  horizon:
                    type: integer
                  simulations:
                    type: integer
                  model:
                    type: string
                  report_markdown:
                    type: string
                    description: Full generated probabilistic report with provenance, distribution, risks and limits.
                  dashboard_markdown:
                    type: string
                    description: Compact dashboard summary.
                  warning:
                    type: string
        "401":
          description: Missing or invalid API key.
        "500":
          description: Model run failed.
  /latest:
    get:
      operationId: latestQuantBtcReport
      summary: Return latest generated report artifacts
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Latest report and dashboard markdown.
          content:
            application/json:
              schema:
                type: object
                required:
                  - report_markdown
                  - dashboard_markdown
                  - warning
                properties:
                  report_markdown:
                    type: string
                  dashboard_markdown:
                    type: string
                  warning:
                    type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Placeholder:
      type: object
      properties:
        ok:
          type: boolean
