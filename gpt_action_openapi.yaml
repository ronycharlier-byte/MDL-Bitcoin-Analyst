openapi: 3.1.0
info:
  title: Quant BTC Model API
  version: 1.6.0
  description: Probabilistic Bitcoin quantitative model endpoint for GPT Custom Actions.
servers:
  - url: https://quant-btc-model-api.onrender.com
    description: Render deployment.
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service health.
  /version:
    get:
      operationId: getQuantBtcVersion
      summary: Return API, model, schema and git version metadata
      responses:
        "200":
          description: Version metadata including api_version, model_version, schema_version, git_commit, runtime limits and default frames.
  /status:
    get:
      operationId: getQuantBtcStatus
      summary: Return public API status, sources, limits and runtime controls
      responses:
        "200":
          description: Public status metadata including data sources, runtime controls, limitations, default frames and version.
  /audit:
    get:
      operationId: auditQuantBtcSystem
      summary: Audit API health, provenance, source policy and latest archive readiness
      description: Preflight governance audit. Use before live analysis. This endpoint does not produce model forecasts; it reports whether the system is ready for a fresh probabilistic run.
      responses:
        "200":
          description: Audit JSON with readiness, blockers, warnings, source policy, latest archive metadata, fundamental field status and version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ready_for_gpt_live_analysis:
                    type: boolean
                  can_attempt_live_run:
                    type: boolean
                  latest_outputs_auditable:
                    type: boolean
                  blockers:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  source_policy:
                    type: string
                  fundamental_snapshot:
                    type: object
                    additionalProperties: true
                  latest_runtime_archive:
                    type: object
                    additionalProperties: true
                  version:
                    type: object
                    additionalProperties: true
                additionalProperties: true
  /run:
    post:
      operationId: runQuantBtcModel
      summary: Run the probabilistic BTC model
      description: Runs a fresh calculation at call time. The API reloads online BTC market data by default, appends the latest Bitget BTCUSDT spot ticker as the reference price, then produces probabilities, distributions, risk metrics, stress tests and provenance. Never returns deterministic advice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - horizon
                - simulations
                - model
              properties:
                asset:
                  type: string
                  default: BTC
                  description: Asset symbol. BTC is the supported production target.
                horizon:
                  type: integer
                  default: 365
                  minimum: 1
                  maximum: 3650
                simulations:
                  type: integer
                  default: 5000
                  minimum: 100
                  maximum: 250000
                  description: Default is optimized for GPT Action latency. Increase only when the user explicitly asks for a deeper run.
                model:
                  type: string
                  default: ensemble
                  enum:
                    - ensemble
                    - monte_carlo
                    - student_t
                    - jump_diffusion
                    - garch
                    - regime_switching
                    - liquidation
                    - correlation
                skip_corpus:
                  type: boolean
                  default: true
                no_online:
                  type: boolean
                  default: false
                  description: Keep false for real-time runs. If true, the API will not fetch online candles or the live Bitget spot ticker.
      responses:
        "200":
          description: Fresh probabilistic model result with JSON body including run_id, report_date, reference_spot, reference_spot_timestamp, source statuses, report_markdown, dashboard_markdown, distribution, risk metrics and warning.
        "401":
          description: Missing or invalid API key.
        "429":
          description: Public rate limit exceeded.
        "500":
          description: Model run failed.
  /multi-run:
    post:
      operationId: runQuantBtcMultiFrame
      summary: Run fresh BTC model across multiple timeframes
      description: Runs fresh fast in-memory probabilistic calculations for several horizons in one server call. Use this for multi-frame analysis such as 7, 30, 90, 180 and 365 days. The API captures one shared Bitget BTCUSDT spot ticker snapshot and applies it to every frame so horizon comparisons use the same reference price. Identical requests may be served from a short cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - horizons
                - simulations
                - model
              properties:
                asset:
                  type: string
                  default: BTC
                  description: Asset symbol. BTC is the supported production target.
                horizons:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: integer
                    minimum: 1
                    maximum: 3650
                  description: Timeframes in days. Use [7, 30, 90, 180, 365] for the standard multi-frame view.
                simulations:
                  type: integer
                  default: 2000
                  minimum: 100
                  maximum: 250000
                  description: Simulations per horizon. Default is optimized for GPT Action latency.
                model:
                  type: string
                  default: ensemble
                  enum:
                    - ensemble
                    - monte_carlo
                    - student_t
                    - jump_diffusion
                    - garch
                    - regime_switching
                    - liquidation
                    - correlation
                skip_corpus:
                  type: boolean
                  default: true
                no_online:
                  type: boolean
                  default: false
                  description: Keep false for real-time multi-frame runs.
      responses:
        "200":
          description: Fresh multi-frame probabilistic result with one frame per horizon, including provenance, source statuses, distributions and risks.
        "401":
          description: Missing or invalid API key.
        "429":
          description: Public rate limit exceeded.
        "500":
          description: All multi-frame model runs failed.
  /latest:
    get:
      operationId: latestQuantBtcReport
      summary: Return latest generated report artifacts
      responses:
        "200":
          description: Latest stored report and dashboard markdown. This is not guaranteed to be fresh; call POST /run for real-time calculation.
components:
  schemas:
    Placeholder:
      type: object
      properties:
        ok:
          type: boolean
