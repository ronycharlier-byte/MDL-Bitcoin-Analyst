openapi: 3.1.0
info:
  title: Quant BTC Model API
  version: 1.0.0
  description: Probabilistic Bitcoin quantitative model endpoint for GPT Custom Actions.
servers:
  - url: https://quant-btc-model-api.onrender.com
    description: Render deployment.
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service health.
  /run:
    post:
      operationId: runQuantBtcModel
      summary: Run the probabilistic BTC model
      description: Produces probabilities, distributions, risk metrics, stress tests and provenance. Never returns deterministic advice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - horizon
                - simulations
                - model
              properties:
                asset:
                  type: string
                  default: BTC
                  description: Asset symbol. BTC is the supported production target.
                horizon:
                  type: integer
                  default: 365
                  minimum: 1
                  maximum: 3650
                simulations:
                  type: integer
                  default: 200000
                  minimum: 100
                  maximum: 250000
                model:
                  type: string
                  default: ensemble
                  enum:
                    - ensemble
                    - monte_carlo
                    - student_t
                    - jump_diffusion
                    - garch
                    - regime_switching
                    - liquidation
                    - correlation
                skip_corpus:
                  type: boolean
                  default: true
                no_online:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Probabilistic model result with JSON body including run_id, provenance, statuses, report_markdown, dashboard_markdown, distribution, risk metrics and warning.
        "401":
          description: Missing or invalid API key.
        "500":
          description: Model run failed.
  /latest:
    get:
      operationId: latestQuantBtcReport
      summary: Return latest generated report artifacts
      responses:
        "200":
          description: Latest report and dashboard markdown.
components:
  schemas:
    Placeholder:
      type: object
      properties:
        ok:
          type: boolean
