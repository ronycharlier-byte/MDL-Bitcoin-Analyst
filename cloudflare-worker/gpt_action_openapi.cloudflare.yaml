openapi: 3.1.0
info:
  title: Quant BTC Model Bitget Bridge Worker
  version: 1.6.0
  description: Always-awake Cloudflare Worker facade for the Render Bitget-backed probabilistic BTC model. Outputs are probabilistic and must never be presented as certainty.
servers:
  - url: https://quant-btc-model-lite.mdl-bitcoin-analyst.workers.dev
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service health JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  worker_version:
                    type: string
                  mode:
                    type: string
                  timestamp:
                    type: string
                additionalProperties: true
  /version:
    get:
      operationId: getQuantBtcLiteVersion
      summary: Return Cloudflare Worker version metadata
      responses:
        "200":
          description: Version metadata JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  worker_version:
                    type: string
                  schema_version:
                    type: string
                  model_version:
                    type: string
                  bridge_target:
                    type: string
                  timestamp:
                    type: string
                additionalProperties: true
  /status:
    get:
      operationId: getQuantBtcLiteStatus
      summary: Return Cloudflare Worker runtime status
      responses:
        "200":
          description: Runtime status, sources and limitations JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  worker_version:
                    type: string
                  data_sources:
                    type: object
                    additionalProperties: true
                  limitations:
                    type: array
                    items:
                      type: string
                  timestamp:
                    type: string
                additionalProperties: true
  /run:
    post:
      operationId: runQuantBtcModel
      summary: Run the Bitget-backed BTC model through the Cloudflare bridge
      description: Primary analysis operation. Default behavior with asset only is multi-frame [7,30,90,180,365]. Send horizon only for a single explicit horizon. No non-Bitget exchange fallback is used by the bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - horizons
                - simulations
                - model
              properties:
                asset:
                  type: string
                  default: BTC
                  description: Asset symbol. BTC is supported.
                horizons:
                  type: array
                  default:
                    - 7
                    - 30
                    - 90
                    - 180
                    - 365
                  description: Use this for complete current BTC analysis. Send [7,30,90,180,365] for multi-frame output.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 3650
                horizon:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Optional single horizon in days. Do not send for complete analysis.
                simulations:
                  type: integer
                  default: 2000
                  minimum: 100
                  maximum: 5000
                  description: Requested simulations. Worker may cap this value to protect the free runtime CPU limit.
                model:
                  type: string
                  default: ensemble
                  enum:
                    - ensemble
                    - monte_carlo
                    - student_t
                    - student_t_model
                    - jump_diffusion
                    - garch
                    - garch_model
                    - regime_switching
                    - liquidation
                    - liquidation_model
                    - correlation
                    - correlation_model
                  description: Render model name. Use ensemble by default.
      responses:
        "200":
          description: Probabilistic Bitget-backed JSON result with provenance, statuses, distribution, regime residual, risk metrics, confidence and warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  asset:
                    type: string
                  horizon:
                    type: integer
                  horizons:
                    type: array
                    items:
                      type: integer
                  simulations:
                    type: integer
                  model:
                    type: string
                  provenance:
                    type: object
                    additionalProperties: true
                  provenance_summary:
                    type: object
                    additionalProperties: true
                  data_status:
                    type: object
                    additionalProperties: true
                  distribution:
                    type: object
                    additionalProperties: true
                  regime_distribution:
                    type: object
                    additionalProperties: true
                  risk_metrics:
                    type: object
                    additionalProperties: true
                  confidence:
                    type: object
                    additionalProperties: true
                  cloudflare_bridge:
                    type: object
                    additionalProperties: true
                  frame_summaries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  frames:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  warning:
                    type: string
                additionalProperties: true
        "500":
          description: Bitget bridge run failed JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  data_status:
                    type: object
                    additionalProperties: true
                  warning:
                    type: string
                additionalProperties: true
        "429":
          description: Public endpoint rate limit reached JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  rate_limit:
                    type: object
                    additionalProperties: true
                  data_status:
                    type: object
                    additionalProperties: true
                  warning:
                    type: string
                additionalProperties: true
  /multiRun:
    post:
      operationId: runQuantBtcMultiFrame
      summary: Run the Bitget-backed BTC model across multiple horizons through the Cloudflare bridge
      description: Calls the Render Python multi-frame engine through Cloudflare and preserves Bitget as the required market source. No non-Bitget exchange fallback is used by the bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - horizons
              properties:
                asset:
                  type: string
                  default: BTC
                  description: Asset symbol. BTC is supported.
                horizons:
                  type: array
                  description: Horizon frames in days.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 3650
                simulations:
                  type: integer
                  default: 2000
                  minimum: 100
                  maximum: 5000
                  description: Requested simulations per horizon. Worker may cap this value.
                model:
                  type: string
                  default: ensemble
                  enum:
                    - ensemble
                    - monte_carlo
                    - student_t
                    - student_t_model
                    - jump_diffusion
                    - garch
                    - garch_model
                    - regime_switching
                    - liquidation
                    - liquidation_model
                    - correlation
                    - correlation_model
                  description: Render model name. Use ensemble by default.
      responses:
        "200":
          description: Multi-frame probabilistic Bitget-backed JSON result with shared provenance, frame summaries, full frames, data statuses, confidence and warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  asset:
                    type: string
                  horizons:
                    type: array
                    items:
                      type: integer
                  model:
                    type: string
                  model_run_id:
                    type: string
                  provenance_summary:
                    type: object
                    additionalProperties: true
                  data_status:
                    type: object
                    additionalProperties: true
                  frame_summaries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  frames:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  cloudflare_bridge:
                    type: object
                    additionalProperties: true
                additionalProperties: true
        "500":
          description: Multi-frame Bitget bridge run failed JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  data_status:
                    type: object
                    additionalProperties: true
                  warning:
                    type: string
                additionalProperties: true
        "429":
          description: Public endpoint rate limit reached JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  rate_limit:
                    type: object
                    additionalProperties: true
                  data_status:
                    type: object
                    additionalProperties: true
                  warning:
                    type: string
                additionalProperties: true
  /latest:
    get:
      operationId: latestQuantBtcReport
      summary: Return latest report status
      responses:
        "200":
          description: Stateless Worker note. Call /run for a fresh probabilistic result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  dashboard_markdown:
                    type: string
                  warning:
                    type: string
                  data_status:
                    type: object
                    additionalProperties: true
                  cloudflare_bridge:
                    type: object
                    additionalProperties: true
                additionalProperties: true
