name = "quant-btc-model-lite"
main = "src/index.ts"
compatibility_date = "2026-05-04"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
MAX_SIMULATIONS = "10000"
DEFAULT_SIMULATIONS = "2000"
DEFAULT_HORIZON = "365"
DEFAULT_HORIZONS = "7,30,90,180,365"
RATE_LIMIT_RUNS_PER_MINUTE = "20"
RATE_LIMIT_WINDOW_SECONDS = "60"
DEEP_RATE_LIMIT_RUNS_PER_MINUTE = "2"
DEEP_RATE_LIMIT_WINDOW_SECONDS = "60"
QUICK_CACHE_MAX_SECONDS = "600"
STALE_CACHE_MAX_SECONDS = "3600"
OPS_MONITOR_ALERT_COOLDOWN_SECONDS = "900"
OPS_DAILY_SUMMARY_PARIS_HOUR = "9"
MODEL_ALERT_VAR95_THRESHOLD = "0.30"
MODEL_ALERT_CONFIDENCE_THRESHOLD = "50"
MODEL_ALERT_TRANSITION_THRESHOLD = "0.25"
MODEL_ALERT_BIAS_DELTA_THRESHOLD = "0.10"
MODEL_ALERT_COOLDOWN_SECONDS = "1800"
MODEL_ALERT_QUICK_REFRESH_SECONDS = "300"
MODEL_ALERT_DEEP_REFRESH_SECONDS = "1800"
RENDER_API_BASE = "https://quant-btc-model-api.onrender.com"
TRADING_MODE = "paper"
TRADING_DEFAULT_NOTIONAL_USDT = "10"
TRADING_MAX_NOTIONAL_USDT = "25"
TRADING_MIN_CONFIDENCE = "55"
TRADING_MAX_VAR95 = "0.25"
TRADING_MAX_TRANSITION = "0.30"
TRADING_BUY_PROB_UP = "0.58"
TRADING_SELL_PROB_UP = "0.42"
TRADING_MAX_SPOT_AGE_SECONDS = "180"
TRADING_TELEGRAM_APPROVAL_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "quant-btc-model-lite-db"
database_id = "db04fd15-f1ac-46c7-9a08-755757849a24"
migrations_dir = "migrations"
