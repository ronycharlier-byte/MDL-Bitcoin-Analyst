[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov=api_server --cov-report=term-missing:skip-covered"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "reports", "external_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api_server.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unreachable = true
files = ["src/contract_validation.py", "src/simulation_utils.py", "src/run_manifest.py"]

[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*"]
ignore_missing_imports = true
