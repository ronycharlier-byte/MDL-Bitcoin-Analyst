<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quant BTC Model Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #fdfefe;
      --ink: #121722;
      --muted: #657184;
      --line: #dbe2ee;
      --blue: #2166f3;
      --green: #10845f;
      --amber: #a86605;
      --red: #b42318;
      --violet: #6654d9;
      --shadow: 0 14px 34px rgba(24, 35, 58, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .topbar, main { width: min(1380px, calc(100% - 28px)); margin: 0 auto; }
    .topbar {
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; letter-spacing: 0; }
    h2 { font-size: 16px; margin: 24px 0 10px; }
    h3 { font-size: 13px; margin-bottom: 8px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    button, input, select {
      border: 1px solid var(--line);
      border-radius: 7px;
      min-height: 38px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 700;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.secondary { background: #eef4ff; border-color: #c8d9ff; color: #1749b4; }
    button.ghost { background: transparent; }
    main { padding: 18px 0 40px; }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }
    aside, section.panel, .metric, .chart, .alert, .plan, .history-row {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    aside { padding: 14px; position: sticky; top: 88px; }
    .stack { display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .field { display: grid; gap: 5px; }
    label { color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select { width: 100%; }
    .panel { padding: 16px; margin-bottom: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 13px; min-height: 86px; box-shadow: none; }
    .metric strong { display: block; margin-top: 4px; font-size: 18px; }
    .metric small { color: var(--muted); }
    .split { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px; border-bottom: 1px solid #e8edf5; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: 12px; background: #f7f9fc; }
    tr:last-child td { border-bottom: 0; }
    .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .chart { padding: 12px; box-shadow: none; }
    .bar-row { display: grid; grid-template-columns: 54px 1fr 70px; align-items: center; gap: 8px; margin: 9px 0; }
    .bar { height: 10px; background: #ecf1f7; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .bar.green > span { background: var(--green); }
    .bar.amber > span { background: var(--amber); }
    .bar.violet > span { background: var(--violet); }
    .alert { padding: 12px; border-left: 4px solid var(--amber); box-shadow: none; }
    .alert.blocker { border-left-color: var(--red); }
    .alert.info { border-left-color: var(--blue); }
    .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .plan { padding: 14px; box-shadow: none; display: grid; gap: 8px; }
    .plan strong { font-size: 18px; }
    .history-row { box-shadow: none; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .status { font-weight: 800; }
    .ok { color: var(--green); }
    .warn { color: var(--amber); }
    .bad { color: var(--red); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .notice { padding: 10px 12px; border-radius: 8px; background: #fff8e8; border: 1px solid #f0d79b; color: #62420a; }
    @media (max-width: 980px) {
      .layout, .split { grid-template-columns: 1fr; }
      aside { position: static; }
      .metrics, .charts, .plans { grid-template-columns: 1fr; }
      .topbar { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      th, td { white-space: normal; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Quant BTC Model</h1>
        <p class="muted">Runs probabilistes live, audit, backtests publics, alertes et suivi client.</p>
      </div>
      <div class="actions">
        <button class="primary" id="runBtn">Lancer 5 frames</button>
        <button class="secondary" id="pdfBtn">PDF</button>
        <button class="ghost" id="refreshBtn">Rafraichir</button>
      </div>
    </div>
  </header>
  <main>
    <div class="layout">
      <aside class="stack">
        <h3>Acces client</h3>
        <div class="field">
          <label for="clientKey">Client key</label>
          <input id="clientKey" placeholder="qbtc_..." autocomplete="off">
        </div>
        <div class="row">
          <button class="secondary" id="saveKeyBtn">Enregistrer</button>
          <button class="ghost" id="clearKeyBtn">Effacer</button>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" placeholder="client@email.com">
        </div>
        <div class="field">
          <label for="plan">Plan</label>
          <select id="plan"><option value="free">Free</option><option value="analyst">Analyst</option><option value="pro">Pro</option></select>
        </div>
        <button id="registerBtn">Creer une cle</button>
        <div id="clientBox" class="notice">Aucune cle client chargee.</div>
        <h3>Alertes</h3>
        <div class="field">
          <label for="alertChannel">Canal</label>
          <select id="alertChannel"><option value="webhook">Webhook</option><option value="discord">Discord</option><option value="telegram">Telegram</option><option value="email">Email</option></select>
        </div>
        <div class="field">
          <label for="alertTarget">Cible</label>
          <input id="alertTarget" placeholder="https://... ou email/chat_id">
        </div>
        <button id="subscribeBtn">Ajouter alerte</button>
        <div id="statusBox" class="muted">Pret.</div>
      </aside>
      <div>
        <section class="metrics" id="summary"></section>
        <section class="panel">
          <h2>Distribution multi-frame</h2>
          <div id="framesTable"></div>
        </section>
        <section class="split">
          <div class="panel">
            <h2>Surface de risque</h2>
            <div class="charts" id="riskCharts"></div>
          </div>
          <div class="panel">
            <h2>Alertes actives</h2>
            <div class="stack" id="alertsBox"></div>
          </div>
        </section>
        <section class="split">
          <div class="panel">
            <h2>Backtests visibles</h2>
            <div id="backtestBox"></div>
          </div>
          <div class="panel">
            <h2>Plans et quotas</h2>
            <div class="plans" id="plansBox"></div>
          </div>
        </section>
        <section class="split">
          <div class="panel">
            <h2>Historique</h2>
            <div class="stack" id="historyBox"></div>
          </div>
          <div class="panel">
            <h2>Comparaison dernier run</h2>
            <div id="compareBox"></div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script>
    const state = { lastRun: null };
    const $ = (id) => document.getElementById(id);
    const headers = () => {
      const key = localStorage.getItem("qbtc_client_key") || "";
      return key ? { "x-client-key": key } : {};
    };
    const jsonHeaders = () => ({ "content-type": "application/json", ...headers() });
    const pct = (v) => v == null ? "absent" : `${(Number(v) * 100).toFixed(2)}%`;
    const usd = (v) => v == null ? "absent" : `$${Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 })}`;
    const text = (v) => v == null || v === "" ? "absent" : String(v);
    const setStatus = (msg, kind = "") => { $("statusBox").className = kind || "muted"; $("statusBox").textContent = msg; };
    function renderEmptyRun() {
      $("summary").innerHTML = [
        ["Run live", "Non lance", "Clique sur Lancer 5 frames"],
        ["Spot Bitget", "Absent", "Sera cite avec timestamp UTC/Paris"],
        ["Archive", "Absent", "Creee apres le run"],
        ["Confidence", "Absent", "Disponible par horizon"],
      ].map(([k,v,s]) => `<div class="metric"><small>${k}</small><strong>${v}</strong><small>${s}</small></div>`).join("");
      $("framesTable").innerHTML = `<p class="muted">Aucun run charge. Lance une analyse live pour afficher P10, mediane, P90, VaR/CVaR, regimes et run_id.</p>`;
      $("riskCharts").innerHTML = `<div class="chart"><h3>VaR 95 perte</h3><p class="muted">En attente du run.</p></div><div class="chart"><h3>Regime bull</h3><p class="muted">En attente du run.</p></div>`;
      $("alertsBox").innerHTML = `<div class="alert info"><strong>En attente</strong><p>Les alertes s'affichent apres un run ou depuis la derniere archive.</p></div>`;
    }
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { ...(options.headers || {}), ...headers() } });
      const data = await response.json().catch(() => ({ status: "error", error: "json_parse_failed" }));
      if (!response.ok) throw new Error(data.detail || data.error || `HTTP ${response.status}`);
      return data;
    }
    function renderSummary(data) {
      const prov = data.provenance_summary || {};
      const archive = data.archive || {};
      const firstSpot = (prov.reference_spots || [])[0];
      const conf365 = (data.frames || []).find(f => f.horizon === 365)?.confidence?.score;
      const spotFresh = data.freshness?.spot?.status || "absent";
      const items = [
        ["Spot Bitget", firstSpot, data.freshness?.spot?.age_seconds != null ? `${data.freshness.spot.age_seconds}s` : ""],
        ["Archive", archive.archive_id || "absent", archive.created_at_paris || ""],
        ["Statut donnees", data.data_status?.fundamental_variables || "absent", `spot ${spotFresh}`],
        ["Confidence 365j", conf365 == null ? "absent" : `${conf365}/100`, "direction longue fragile si < 50"],
      ];
      $("summary").innerHTML = items.map(([k,v,s]) => `<div class="metric"><small>${k}</small><strong>${v}</strong><small>${s}</small></div>`).join("");
    }
    function renderFrames(data) {
      const rows = (data.frames || []).map(f => {
        const d = f.distribution || {}, r = f.risk_metrics || {}, c = f.confidence || {}, m = f.monte_carlo_error || {};
        const margin = m.probabilities?.prob_up?.margin_95;
        return `<tr><td>${f.horizon}j</td><td class="mono">${f.run_id}</td><td>${usd(d.p10_price)}</td><td>${usd(d.median_price)}</td><td>${usd(d.p90_price)}</td><td>${pct(d.prob_up)} ${margin == null ? "" : `+/- ${(margin*100).toFixed(2)}pt`}</td><td>${pct(r.var_95)}</td><td>${pct(r.cvar_95)}</td><td>${c.score ?? "absent"}/100</td></tr>`;
      }).join("");
      $("framesTable").innerHTML = `<table><thead><tr><th>Horizon</th><th>Run ID</th><th>P10</th><th>Mediane</th><th>P90</th><th>P(up)</th><th>VaR95</th><th>CVaR95</th><th>Confidence</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    function renderRisk(data) {
      const frames = data.frames || [];
      const riskBars = frames.map(f => `<div class="bar-row"><span>${f.horizon}j</span><div class="bar amber"><span style="width:${Math.min(100, (f.risk_metrics?.var_95 || 0) * 180)}%"></span></div><span>${pct(f.risk_metrics?.var_95)}</span></div>`).join("");
      const regimeBars = frames.map(f => {
        const reg = f.regime_distribution || {};
        return `<div class="bar-row"><span>${f.horizon}j</span><div class="bar green"><span style="width:${Math.min(100, (reg.bull || 0) * 100)}%"></span></div><span>${pct(reg.bull)}</span></div>`;
      }).join("");
      $("riskCharts").innerHTML = `<div class="chart"><h3>VaR 95 perte</h3>${riskBars}</div><div class="chart"><h3>Regime bull</h3>${regimeBars}</div>`;
    }
    function renderAlerts(data) {
      const alerts = data.alerts || [];
      $("alertsBox").innerHTML = alerts.length ? alerts.map(a => `<div class="alert ${a.level || ""}"><strong>${a.type}</strong><p>${a.message || `Horizon ${a.horizon ?? ""} valeur ${pct(a.value)}`}</p></div>`).join("") : `<div class="alert info"><strong>Aucune alerte</strong><p>Le dernier run ne signale pas de seuil critique.</p></div>`;
    }
    async function runLive() {
      setStatus("Run multi-frame en cours...");
      const data = await api("/multi-run", { method: "POST", headers: jsonHeaders(), body: JSON.stringify({ asset: "BTC" }) });
      state.lastRun = data;
      renderSummary(data); renderFrames(data); renderRisk(data); renderAlerts(data);
      setStatus("Run termine.", "ok");
      await refreshSecondary();
    }
    async function refreshSecondary() {
      const [history, compare, backtests, plans, me] = await Promise.allSettled([
        api("/history"),
        api("/compare-runs"),
        api("/backtest-summary"),
        api("/billing/plans"),
        api("/clients/me"),
      ]);
      if (history.status === "fulfilled") renderHistory(history.value);
      if (compare.status === "fulfilled") renderCompare(compare.value);
      if (backtests.status === "fulfilled") renderBacktests(backtests.value);
      if (plans.status === "fulfilled") renderPlans(plans.value);
      if (me.status === "fulfilled") renderClient(me.value);
    }
    function renderHistory(data) {
      $("historyBox").innerHTML = (data.archives || []).slice(0, 8).map(a => `<div class="history-row"><div><strong>${a.archive_id}</strong><div class="muted">${a.created_at_paris || ""} | ${a.horizons?.join("/") || "single"} | ${a.reference_spot || "spot absent"}</div></div><span class="status ok">${a.status}</span></div>`).join("") || "<p class='muted'>Aucun historique runtime.</p>";
    }
    function renderCompare(data) {
      if (data.status !== "ok") { $("compareBox").innerHTML = `<p class="muted">${data.message || "Comparaison absente."}</p>`; return; }
      $("compareBox").innerHTML = `<table><thead><tr><th>Horizon</th><th>Delta P(up)</th><th>Delta VaR95</th><th>Delta conf.</th></tr></thead><tbody>${(data.frames || []).map(f => `<tr><td>${f.horizon}j</td><td>${pct(f.prob_up_delta)}</td><td>${pct(f.var_95_delta)}</td><td>${text(f.confidence_delta)}</td></tr>`).join("")}</tbody></table>`;
    }
    function renderBacktests(data) {
      $("backtestBox").innerHTML = `<table><thead><tr><th>Horizon</th><th>Hit</th><th>Brier</th><th>P10/P90 cov.</th><th>VaR95 breach</th><th>RW Brier</th></tr></thead><tbody>${(data.rows || []).map(r => `<tr><td>${r.horizon_days}j</td><td>${pct(r.hit_rate)}</td><td>${r.brier_score == null ? "absent" : Number(r.brier_score).toFixed(3)}</td><td>${pct(r.p10_p90_coverage)}</td><td>${pct(r.var95_breach_rate)}</td><td>${r.random_walk_brier_score == null ? "absent" : Number(r.random_walk_brier_score).toFixed(3)}</td></tr>`).join("")}</tbody></table>`;
    }
    function renderPlans(data) {
      const plans = data.plans || {};
      $("plansBox").innerHTML = Object.entries(plans).map(([id, p]) => `<div class="plan"><span class="muted">${p.name}</span><strong>${p.price_eur} EUR/mois</strong><span>${p.monthly_run_quota} runs/mois</span><button onclick="checkout('${id}')" ${id === "free" ? "disabled" : ""}>Checkout</button></div>`).join("");
    }
    function renderClient(data) {
      const usage = data.client_usage || {};
      $("clientBox").innerHTML = usage.authenticated ? `<strong>${usage.plan}</strong><br>${usage.usage_this_month}/${usage.quota_runs_per_month} runs ce mois<br><span class="mono">${usage.client_id}</span>` : "Aucune cle client chargee.";
    }
    async function checkout(plan) {
      const body = { plan, email: $("email").value || undefined };
      const data = await api("/billing/checkout", { method: "POST", headers: jsonHeaders(), body: JSON.stringify(body) });
      if (data.checkout_url) location.href = data.checkout_url;
      else setStatus(data.reason || data.error || "Stripe absent.", "warn");
    }
    $("runBtn").onclick = () => runLive().catch(e => setStatus(e.message, "bad"));
    $("refreshBtn").onclick = () => refreshSecondary().catch(e => setStatus(e.message, "bad"));
    $("pdfBtn").onclick = () => { location.href = "/pdf-report"; };
    $("saveKeyBtn").onclick = () => { localStorage.setItem("qbtc_client_key", $("clientKey").value.trim()); refreshSecondary(); };
    $("clearKeyBtn").onclick = () => { localStorage.removeItem("qbtc_client_key"); $("clientKey").value = ""; refreshSecondary(); };
    $("registerBtn").onclick = async () => {
      try {
        const data = await api("/clients/register", { method: "POST", headers: jsonHeaders(), body: JSON.stringify({ email: $("email").value || null, plan: $("plan").value }) });
        localStorage.setItem("qbtc_client_key", data.client_key);
        $("clientKey").value = data.client_key;
        renderClient({ client_usage: { authenticated: true, client_id: data.client_id, plan: data.plan, usage_this_month: 0, quota_runs_per_month: data.quota_runs_per_month } });
        setStatus("Cle creee et stockee localement.", "ok");
      } catch (e) { setStatus(e.message, "bad"); }
    };
    $("subscribeBtn").onclick = async () => {
      try {
        const body = { channel: $("alertChannel").value, target: $("alertTarget").value, min_level: "warning" };
        const data = await api("/alerts/subscribe", { method: "POST", headers: jsonHeaders(), body: JSON.stringify(body) });
        setStatus(`Alerte ajoutee: ${data.subscription_id}`, "ok");
      } catch (e) { setStatus(e.message, "bad"); }
    };
    $("clientKey").value = localStorage.getItem("qbtc_client_key") || "";
    renderEmptyRun();
    refreshSecondary().catch(() => {});
  </script>
</body>
</html>
