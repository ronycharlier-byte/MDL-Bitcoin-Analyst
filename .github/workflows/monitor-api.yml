name: Monitor Quant BTC API

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quant-btc-api-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict quality monitor
        env:
          CF_BASE: https://quant-btc-model-lite.mdl-bitcoin-analyst.workers.dev
          RENDER_BASE: https://quant-btc-model-api.onrender.com
          MIN_API_VERSION: "1.8.0"
          REQUIRED_REAL_FIELDS: etf_flows,funding_rate,open_interest,hash_rate,exchange_reserves,stablecoins_supply,dxy,us_rates,nasdaq
          ALLOWED_ABSENT_FIELDS: liquidations
        run: |
          set -euo pipefail
          python scripts/quality_monitor.py --output quality-monitor-summary.json

      - name: Upload monitor summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-monitor-summary
          path: quality-monitor-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Open visible monitor alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "[quant-btc-monitor-alert]";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const summaryPath = "quality-monitor-summary.json";
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, "utf8").slice(0, 6000)
              : "No monitor summary artifact was produced.";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `${marker}`,
              "",
              "The live Quant BTC quality monitor failed.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Failure summary:",
              "```json",
              summary,
              "```",
              "",
              "Do not treat live GPT outputs as healthy until this alert is closed by a passing monitor run."
            ].join("\n");
            const query = `repo:${owner}/${repo} is:issue is:open ${marker}`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });
            if (found.data.items.length) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: found.data.items[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: `${marker} Live API quality monitor failing`,
                body
              });
            }

      - name: Close resolved monitor alert issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "[quant-btc-monitor-alert]";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const query = `repo:${owner}/${repo} is:issue is:open ${marker}`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 5 });
            for (const item of found.data.items) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: item.number,
                body: `${marker}\n\nMonitor recovered on workflow run ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: item.number,
                state: "closed"
              });
            }
