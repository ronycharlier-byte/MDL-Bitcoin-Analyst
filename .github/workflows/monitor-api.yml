name: Monitor Quant BTC API

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-btc-api-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict quality monitor
        env:
          CF_BASE: https://quant-btc-model-lite.mdl-bitcoin-analyst.workers.dev
          RENDER_BASE: https://quant-btc-model-api.onrender.com
          MIN_API_VERSION: "1.4.0"
          REQUIRED_REAL_FIELDS: etf_flows,funding_rate,open_interest,hash_rate,stablecoins_supply,dxy,us_rates,nasdaq
          ALLOWED_ABSENT_FIELDS: liquidations,exchange_reserves
        run: |
          set -euo pipefail
          python scripts/quality_monitor.py --output quality-monitor-summary.json

      - name: Upload monitor summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-monitor-summary
          path: quality-monitor-summary.json
          if-no-files-found: ignore
          retention-days: 14
