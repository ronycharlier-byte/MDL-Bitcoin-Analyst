name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked production and test dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0 wheel
          python -m pip install --requirement requirements-dev.txt
      - name: Lint maintained Python surfaces
        run: >-
          ruff check
          src/contract_validation.py src/simulation_utils.py src/risk_metrics.py
          src/ensemble_model.py src/backtest.py src/confidence_score.py src/run_manifest.py src/logging_utils.py
          tests scripts/validate_openapi.py scripts/scan_secrets.py scripts/generate_repository_inventory.py
          scripts/quality_monitor.py scripts/archive_live_run.py
      - name: Check maintained Python formatting
        run: >-
          ruff format --check
          src/contract_validation.py src/simulation_utils.py src/risk_metrics.py
          src/ensemble_model.py src/backtest.py src/confidence_score.py src/run_manifest.py src/logging_utils.py
          tests scripts/validate_openapi.py scripts/scan_secrets.py scripts/generate_repository_inventory.py
          scripts/quality_monitor.py scripts/archive_live_run.py
      - name: Progressive Python type check
        run: python -m mypy
      - name: Compile Python
        run: python -m compileall -q src scripts api_server.py
      - name: Unit, contract, invariant and API security tests
        run: python -m pytest -q
      - name: Audit installed Python environment
        run: pip-audit --local

  cloudflare-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and contract tests
        run: npm test
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high

  secret-history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Scan current tree and reachable Git history for high-confidence secrets
        run: python scripts/scan_secrets.py --history

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate reproducible CycloneDX inventories
        run: |
          python -m pip install cyclonedx-bom==7.3.0
          cyclonedx-py requirements requirements.txt --output-reproducible --output-file sbom-python.cdx.json
          npm --prefix cloudflare-worker sbom --package-lock-only --omit=dev --sbom-format cyclonedx > sbom-worker.cdx.json
      - name: Upload SBOMs for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom-python.cdx.json
            sbom-worker.cdx.json
          retention-days: 14
