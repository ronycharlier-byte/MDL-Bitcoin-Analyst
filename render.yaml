services:
  - type: web
    name: quant-btc-model-api
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /live
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_API_SIMULATIONS
        value: "250000"
      - key: RUN_TIMEOUT_SECONDS
        value: "280"
      - key: QUANT_API_KEY
        sync: false
      - key: CLIENT_KEY_HASH_SECRET
        sync: false
      - key: ALLOWED_HOSTS
        value: "quant-btc-model-api.onrender.com,localhost,127.0.0.1"
      - key: ENABLE_API_DOCS
        value: "0"
